<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuentra tu número — Actividad de apertura</title>
<meta name="description" content="Actividad de apertura para presentarte: elige tu número y descubre el reto que te corresponde.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:oklch(0.29 0.13 267);--navy2:#13318c;--ice:oklch(0.97 0.02 200);--dim:oklch(0.75 0.05 260)}
*{box-sizing:border-box}
.wrap>section{min-width:0}
body{margin:0;background:var(--navy);color:var(--ice);font-family:"DM Sans",sans-serif}
.wrap{max-width:80rem;margin:0 auto;padding:1rem;display:grid;grid-template-columns:1fr;gap:2rem;align-items:start}
@media(min-width:1024px){.wrap{grid-template-columns:2fr 1fr;padding:2rem}}
h1{font-family:"Space Grotesk",sans-serif;font-size:2.25rem;margin:.25rem 0 .5rem;letter-spacing:-.02em}
.kicker{font-size:.875rem;color:var(--dim);margin:0}
.lead{font-size:1.125rem;color:rgba(238,242,247,.6);margin:0 0 1.5rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;grid-auto-flow:dense}
@media(min-width:640px){.grid{grid-template-columns:repeat(6,1fr)}}
.tile{font-family:"Space Grotesk",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.1);border-radius:1rem;background:var(--navy2);color:var(--ice);width:100%;min-width:0;aspect-ratio:1;font-size:1.35rem;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
.tile.wide{grid-column:span 2;aspect-ratio:2/1;font-size:1.5rem}
.tile.featured{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;font-size:3rem}
.tile:hover{background:var(--ice);color:var(--navy);transform:scale(1.03)}
.tile[aria-pressed="true"]{background:var(--ice);color:var(--navy);box-shadow:0 10px 25px rgba(0,0,0,.3)}
.foot{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(238,242,247,.3);margin-top:2rem}
.panel{position:relative;background:var(--ice);color:var(--navy);border-radius:1.5rem;padding:2rem;box-shadow:0 25px 50px rgba(0,0,0,.35)}
@media(min-width:1024px){.panel{position:sticky;top:2rem}}
.badge{position:absolute;right:-.75rem;top:-.75rem;width:4rem;height:4rem;border-radius:1rem;background:var(--navy2);color:var(--ice);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.5rem}
.panel h2{font-family:"Space Grotesk",sans-serif;font-size:1.75rem;line-height:1.15;margin:0 0 1rem}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(10,36,99,.5);margin:1.5rem 0 .5rem}
.mech{font-size:1.05rem;font-weight:500;line-height:1.6;margin:0}
ul{margin:.75rem 0 0;padding:0;list-style:none}
li{display:flex;gap:.75rem;align-items:flex-start;line-height:1.6;margin-bottom:.5rem}
li::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--navy2);margin-top:.6rem;flex:0 0 auto}
.phrase{border:1px solid rgba(10,36,99,.15);background:rgba(10,36,99,.05);border-radius:.75rem;padding:.75rem 1rem;font-weight:500;line-height:1.5;margin:0 0 .75rem}
.origin{font-size:.875rem;line-height:1.6;color:rgba(10,36,99,.7);margin:0}
.panel img{width:100%;height:auto;display:block;border-radius:1rem;overflow:hidden}
.cap{border-left:2px solid var(--navy2);padding-left:1rem;font-style:italic;font-size:.875rem;line-height:1.6;color:rgba(10,36,99,.8);margin:1rem 0 0}
.back{width:100%;margin-top:2rem;border:1px solid rgba(10,36,99,.2);background:transparent;border-radius:1rem;padding:.75rem;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;color:var(--navy)}
.back:hover{background:var(--navy);color:var(--ice)}
</style></head><body>

úmero 24">24</button><button class="tile" data-n="25" aria-label="Ver el reto del número 25">25</button><button class="tile" data-n="26" aria-label="Ver el reto del número 26">26</button><button class="tile" data-n="27" aria-label="Ver el reto del número 27">27</button><button class="tile" data-n="28" aria-label="Ver el reto del número 28">28</button><button class="tile wide" data-n="29" aria-label="Ver el reto del número 29">29</button><button class="tile" data-n="30" aria-label="Ver el reto del número 30">30</button></div>

const assignment = Array.from({length:30}, () => Math.floor(Math.random()*CHALLENGES.length));
const panel = document.getElementById('panel');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(n){
  if(n===null){panel.innerHTML='';return;}
  const c = CHALLENGES[assignment[n-1]];
  let doWhat = c.mechanic ? `<p class="mech">${esc(c.mechanic)}</p>` : '';
  if(!c.mechanic){
    if(c.intro) doWhat += `<p class="mech">${esc(c.intro)}</p>`;
    if(c.steps) doWhat += '<ul>' + c.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('') + '</ul>';
    if(c.phrases) doWhat += c.phrases.map(p=>`<p class="phrase">${esc(p)}</p>`).join('');
  }
  panel.innerHTML = `<div class="panel"><div class="badge">${String(n).padStart(2,'0')}</div>
  <h2>${esc(c.title)}</h2>
  <p class="lbl">Qué vas a hacer</p>${doWhat}
  <p class="lbl">De dónde viene este formato</p><p class="origin">${esc(c.origin)}</p>
  <p class="lbl">Ejemplo</p><img src="${c.image}" alt="${esc(c.alt)}">
  <p class="cap">${esc(c.caption)}</p>
  <button class="back">← Volver a los números</button></div>`;
  panel.querySelector('.back').onclick = () => {
    document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed','false'));
    render(null);
  };
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
document.querySelectorAll('.tile').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed','false'));
  t.setAttribute('aria-pressed','true');
  render(Number(t.dataset.n));
});
</script></body></html>

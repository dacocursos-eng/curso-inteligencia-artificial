<style>

/* hero */

.pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;border:1px solid rgba(255,255,255,.15);padding:.375rem 1rem;font-size:.78rem;color:var(--dim-on-navy)}
.iconbox{display:flex;height:4rem;width:4rem;flex-shrink:0;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);font-size:1.5rem;color:var(--ice)}
.purpose{position:relative;overflow:hidden;border-radius:.75rem;border:1px solid rgba(235,253,255,.2);background:rgba(235,253,255,.08);padding:1.75rem}
.purpose p{margin:1rem 0 0;font-family:var(--font-display);font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.45;font-weight:500;color:#fff}
.blockcard .num{font-family:var(--font-display);font-size:1.4rem;line-height:1;color:var(--navy-deep)}
.blockcard h2{font-size:1.3rem;line-height:1.375;color:var(--on-white)}
.blockcard p{margin:.625rem 0 0;font-size:.94rem;line-height:1.625;color:var(--dim-on-white)}
.aside-card{position:relative;overflow:hidden;border-radius:.75rem;background:rgba(255,255,255,.95);padding:1.75rem}
@media (min-width:1024px){.aside{position:sticky;top:6rem;align-self:start}}

/* prompt panel */
.panel{position:relative;overflow:hidden;border-radius:.75rem;background:#fff;padding:1.5rem;box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}

.copybtn:hover{background:var(--navy-deep)}
.copybtn .status{height:.375rem;width:.375rem;border-radius:9999px;background:rgba(235,253,255,.4)}

@media (min-width:640px){.promptbox{padding:1.5rem}}

.panel .note2{margin:1.25rem 0 0;border-left:4px solid var(--navy-deep);background:rgba(235,253,255,.7);padding:.75rem 1rem;font-size:.86rem;line-height:1.625;color:var(--on-white)}
.panel .note2 strong{font-weight:600}

.star-pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;border:1px solid rgba(235,253,255,.3);background:rgba(235,253,255,.1);padding:.375rem 1rem;font-size:.78rem;font-weight:600;color:var(--ice)}
.sharestep{display:flex;align-items:flex-start;gap:1rem;border-radius:.5rem;border:1px solid rgba(0,32,91,.1);background:rgba(235,253,255,.4);padding:1.25rem}
.sharestep .num{font-family:var(--font-display);font-size:1.1rem;line-height:1;color:var(--navy-deep)}

/* misc */
.border-top{border-top:1px solid rgba(255,255,255,.1)}
footer{border-top:1px solid rgba(255,255,255,.1);padding:2.5rem 0}
footer .inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;font-size:.8rem;color:var(--dim-on-navy)}
.flexwrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.5rem}
.flexstart{display:flex;flex-wrap:wrap;align-items:flex-start;gap:1.5rem}
.mt12{margin-top:3rem}.mt10{margin-top:2.5rem}.mt9{margin-top:2.25rem}.mt7{margin-top:1.75rem}.mt6{margin-top:1.5rem}.mt5{margin-top:1.25rem}.mt4{margin-top:1rem}.mt3{margin-top:.75rem}
.pb20{padding-bottom:5rem}.pb14{padding-bottom:3.5rem}.pb12{padding-bottom:3rem}.pt14{padding-top:3.5rem}.pt12{padding-top:3rem}
@media (min-width:640px){.hero-sec{padding-top:5rem}}

@media (min-width:640px){.hidden-sm{display:block}}

<script>
const DATA = {"challenges": [{"id": "cancion", "number": "01", "icon": "♫", "title": "Una canción que diga algo", "purpose": "Convertir una idea en una canción. Puede ser sobre la organización, un proyecto, una situación del trabajo, una celebración o cualquier concepto que quieran llevar al terreno musical.", "actionTitle": "Manos a la obra", "action": "Empiecen preguntándole a la IA cómo convertir su idea en una canción y qué necesitan decidir antes de generarla. Construyan con ella la letra, el tono y la dirección musical. Después lleven esas instrucciones a la herramienta que hayan elegido y escuchen el resultado.", "reflectionTitle": "Jueguen con la idea", "reflection": "Prueben una segunda versión cambiando algo importante: el género, la energía, la perspectiva, la letra o la audiencia. Comparen qué cambió.", "finish": "Guarden la versión que quieran presentar y tengan claro qué decisiones hicieron que funcionara.", "tools": "Suno", "tip": "La calidad del resultado depende mucho de cómo describan el tipo de canción que quieren. Dejen que la IA les ayude a encontrar ese lenguaje.", "prompt": "Tenemos que resolver este reto:\n\n01 · Una canción que diga algo\n\nTenemos 40 minutos y queremos terminar con una canción que podamos mostrar.\n\nQueremos que seas nuestro tutor durante el proceso. Ayúdanos a descubrir cómo convertir nuestra idea en una canción y a aprender mientras la construimos.\n\nPrimero ayúdanos a precisar qué queremos comunicar, para quién y qué debería transmitir la canción. Cuando hayas entendido nuestra idea y antes de que elijamos una herramienta concreta, genera una INFOGRAFÍA VISUAL comparando las herramientas de IA especializadas que podrían servir para crearla. Incluye, de manera clara, qué hace cada herramienta, sus características principales, ventajas, limitaciones, qué opciones gratuitas ofrece y qué debemos tener en cuenta para trabajar con ellas. Presenta las opciones que consideres realmente pertinentes para este reto y usa información actual cuando esté disponible.\n\nDespués de mostrarnos la infografía, ayúdanos a elegir la herramienta que mejor se ajuste a nuestra idea y a las posibilidades gratuitas disponibles. Luego enseñanos paso a paso cómo utilizarla. Ayúdanos primero a definir la letra, el tono, el género, la energía y la dirección musical que necesitamos, y después a preparar el prompt más preciso posible antes de llevarlo a la herramienta.\n\nAcompañanos mientras hacemos una primera versión. Cuando te mostremos el resultado, ayúdanos a revisarlo y a decidir qué cambiar para hacer una segunda versión. Ayúdanos a aprovechar bien los recursos gratuitos y a evitar gastar generaciones o créditos innecesariamente.\n\nVe paso a paso, haznos las preguntas que realmente necesites y ayúdanos a aprender mientras construimos."}, {"id": "comercial", "number": "02", "icon": "▶", "title": "El comercial que vendería la idea", "purpose": "Imaginen que tienen un minuto para conseguir que alguien se interese por un producto, servicio, proyecto o iniciativa. Van a convertir esa idea en un comercial.", "actionTitle": "Manos a la obra", "action": "Cuéntenle a la IA qué quieren comunicar y para quién. Pídanle que les ayude a pensar el concepto, el guion, las escenas y la forma de producirlo. Después construyan el video.", "reflectionTitle": "Denle personalidad", "reflection": "Decidan qué quieren que sienta la persona que lo vea: curiosidad, confianza, entusiasmo, urgencia, sorpresa. Hagan que esa intención se note en el resultado.", "finish": "Presenten el comercial y cuenten qué decisiones tomaron para convertir una idea en una pieza audiovisual.", "tools": "HeyGen, Canva", "tip": "Piensen primero como creativos: ¿cuál es la historia que quieren contar en ese minuto? La herramienta viene después.", "prompt": "Tenemos que resolver este reto:\n\n02 · El comercial que vendería la idea\n\nTenemos 40 minutos y queremos terminar con un comercial de aproximadamente un minuto que podamos mostrar.\n\nQueremos que seas nuestro tutor durante el proceso. Ayúdanos a descubrir cómo convertir nuestra idea en un comercial y a aprender mientras lo construimos.\n\nPrimero ayúdanos a precisar qué queremos comunicar, quién debe recibir el mensaje y qué queremos que sienta o haga después de verlo. Cuando hayas entendido nuestra idea y antes de que elijamos una herramienta concreta, genera una INFOGRAFÍA VISUAL comparando las herramientas de IA especializadas que podrían servir para crear el comercial. Incluye, de manera clara, qué hace cada herramienta, sus características principales, ventajas, limitaciones, qué opciones gratuitas ofrece y qué debemos tener en cuenta para trabajar con ellas. Presenta las opciones que consideres realmente pertinentes para este reto y usa información actual cuando esté disponible.\n\nDespués de mostrarnos la infografía, ayúdanos a elegir la herramienta que mejor se ajuste a nuestra idea y a las posibilidades gratuitas disponibles. Luego enseñanos paso a paso cómo utilizarla. Ayúdanos a definir primero el concepto, la historia, el tono, el público, el guion y las escenas, y después a preparar el prompt o las instrucciones más precisas antes de llevarlas a la herramienta.\n\nAcompañanos mientras hacemos una primera versión. Cuando te mostremos el resultado, ayúdanos a revisarlo y a decidir qué cambiar para mejorar el comercial. Ayúdanos a aprovechar bien los recursos gratuitos y a evitar gastar generaciones o créditos innecesariamente.\n\nVe paso a paso, haznos las preguntas que realmente necesites y ayúdanos a aprender mientras construimos."}, {"id": "experto", "number": "03", "icon": "◉", "title": "Pónganle voz a un experto", "purpose": "Imaginen que tienen un experto con algo valioso que explicar, pero necesitan convertir su conocimiento en una intervención breve, clara y atractiva.", "actionTitle": "Manos a la obra", "action": "Definan quién es ese experto, qué sabe, a quién le habla y qué quiere que la audiencia recuerde. Pídanle a la IA que les ayude a construir el contenido y después conviértanlo en voz o en una presentación audiovisual.", "reflectionTitle": "Hagan que suene creíble", "reflection": "Trabajen el lenguaje, el tono y la manera de explicar. Un experto hablando con un equipo directivo suena diferente a un experto explicándole algo a un cliente o a un ciudadano.", "finish": "Muestren la pieza y expliquen cómo transformaron conocimiento en una experiencia de comunicación.", "tools": "ElevenLabs, HeyGen, Canva", "tip": "El personaje importa. Definir quién habla y cómo habla puede cambiar por completo el resultado.", "prompt": "Tenemos que resolver este reto:\n\n03 · Pónganle voz a un experto\n\nTenemos 40 minutos y queremos terminar con una pieza breve que podamos mostrar y escuchar.\n\nQueremos que seas nuestro tutor durante el proceso. Ayúdanos a descubrir cómo convertir el conocimiento de un experto en una intervención clara, atractiva y creíble.\n\nPrimero ayúdanos a precisar quién es el experto, qué sabe, a quién le habla, qué queremos que recuerde la audiencia y qué tipo de experiencia queremos crear. Cuando hayas entendido nuestra idea y antes de que elijamos una herramienta concreta, genera una INFOGRAFÍA VISUAL comparando las herramientas de IA especializadas que podrían servir para convertir ese conocimiento en voz, personaje o pieza audiovisual. Incluye, de manera clara, qué hace cada herramienta, sus características principales, ventajas, limitaciones, qué opciones gratuitas ofrece y qué debemos tener en cuenta para trabajar con ellas. Presenta las opciones que consideres realmente pertinentes para este reto y usa información actual cuando esté disponible.\n\nDespués de mostrarnos la infografía, ayúdanos a elegir la herramienta que mejor se ajuste a lo que queremos producir y a las posibilidades gratuitas disponibles. Luego enseñanos paso a paso cómo utilizarla. Ayúdanos a construir primero el contenido, el lenguaje y el tono del experto, y después a preparar el prompt o las instrucciones más precisas antes de llevarlas a la herramienta.\n\nAcompáñanos mientras hacemos una primera versión. Cuando te mostremos el resultado, ayúdanos a revisarlo y a mejorar la forma en que comunica el conocimiento. Ayúdanos a aprovechar bien los recursos gratuitos y a evitar gastar generaciones o créditos innecesariamente.\n\nVe paso a paso, haznos las preguntas que realmente necesites y ayúdanos a aprender mientras construimos."}, {"id": "podcast", "number": "04", "icon": "◖◗", "title": "De documento a podcast", "purpose": "Tomar un documento y transformarlo en una experiencia de audio que una persona pueda escuchar mientras comprende sus ideas principales.", "actionTitle": "Manos a la obra", "action": "Trabajen con el documento que tengan disponible. Pregúntenle a la IA cómo extraer lo importante, cómo orientar la conversación y cómo convertir el contenido en un podcast.", "reflectionTitle": "Piensen en quien escucha", "reflection": "Imaginen que esa persona va caminando, conduciendo o haciendo otra tarea. ¿Qué necesita escuchar para terminar entendiendo el tema?", "finish": "Reproduzcan un fragmento significativo y expliquen qué hicieron para pasar de una fuente escrita a una experiencia de audio.", "tools": "NotebookLM", "tip": "La selección de las fuentes y el enfoque de la conversación son parte del resultado. Empiecen por decidir qué quieren que el oyente se lleve.", "prompt": "Tenemos que resolver este reto:\n\n04 · De documento a podcast\n\nTenemos 40 minutos y queremos terminar con un podcast o una pieza de audio que podamos reproducir y mostrar.\n\nQueremos que seas nuestro tutor durante el proceso. Ayúdanos a descubrir cómo transformar el documento en una experiencia de audio que permita comprender sus ideas principales.\n\nPrimero ayúdanos a precisar qué contiene el documento, qué queremos que se lleve quien escucha y qué tipo de conversación o experiencia de audio tendría sentido. Cuando hayas entendido nuestra necesidad y antes de que elijamos una herramienta concreta, genera una INFOGRAFÍA VISUAL comparando las herramientas de IA especializadas que podrían servir para transformar documentos en audio o podcasts. Incluye, de manera clara, qué hace cada herramienta, sus características principales, ventajas, limitaciones, qué opciones gratuitas ofrece y qué debemos tener en cuenta para trabajar con ellas. Presenta las opciones que consideres realmente pertinentes para este reto y usa información actual cuando esté disponible.\n\nDespués de mostrarnos la infografía, ayúdanos a elegir la herramienta que mejor se ajuste al documento y a las posibilidades gratuitas disponibles. Luego enseñamos paso a paso cómo utilizarla. Ayúdanos a decidir qué contenido conservar, qué enfoque darle a la conversación y qué instrucciones o prompt necesitamos antes de llevar el documento a la herramienta.\n\nAcompañanos mientras hacemos una primera versión. Cuando te mostremos o escuchemos el resultado, ayúdanos a revisarlo y a decidir qué cambiar para que la experiencia de audio sea más clara e interesante. Ayúdanos a aprovechar bien los recursos gratuitos y a evitar gastar generaciones o créditos innecesariamente.\n\nVe paso a paso, haznos las preguntas que realmente necesites y ayúdanos a aprender mientras construimos."}, {"id": "web", "number": "05", "icon": "⌘", "title": "Una idea que se convierte en web", "purpose": "Partir de una idea y convertirla en una página web que alguien pueda abrir, recorrer y entender.", "actionTitle": "Manos a la obra", "action": "Puede ser un nuevo servicio, una iniciativa, un producto, una solución para un problema cotidiano o una idea que siempre hayan querido probar. Cuéntenle a la IA qué quieren construir y pídanle que les enseñe cómo llevarlo a una web funcional.", "reflectionTitle": "Piensen como usuarios", "reflection": "Imaginen que una persona llega por primera vez a la página. En pocos segundos debería entender qué es, para quién es y qué puede hacer allí.", "finish": "Abran la página y hagan una pequeña demostración. Muestren qué construyeron y qué aprendieron durante el proceso.", "tools": "Lovable, Replit, Gamma", "tip": "Cuanto más clara sea la idea que quieren convertir en producto, más fácil será que la IA les ayude a construirla.", "prompt": "Tenemos que resolver este reto:\n\n05 · Una idea que se convierte en web\n\nTenemos 40 minutos y queremos terminar con una página web que podamos abrir, recorrer y mostrar.\n\nQueremos que seas nuestro tutor durante el proceso. Ayúdanos a descubrir cómo convertir nuestra idea en una página web y a aprender mientras la construimos.\n\nPrimero ayúdanos a precisar qué queremos construir, para quién, qué debe entender la persona que llegue a la página y qué debería poder hacer allí. Cuando hayas entendido nuestra idea y antes de que elijamos una herramienta concreta, genera una INFOGRAFÍA VISUAL comparando las herramientas de IA especializadas que podrían servir para crear una página web a partir de nuestra idea. Incluye, de manera clara, qué hace cada herramienta, sus características principales, ventajas, limitaciones, qué opciones gratuitas ofrece y qué debemos tener en cuenta para trabajar con ellas. Presenta las opciones que consideres realmente pertinentes para este reto y usa información actual cuando esté disponible.\n\nDespués de mostrarnos la infografía, ayúdanos a elegir la herramienta que mejor se ajuste a nuestra idea y a las posibilidades gratuitas disponibles. Luego enseñamos paso a paso cómo utilizarla. Ayúdanos primero a definir la estructura, el contenido, la experiencia del usuario y las funcionalidades que realmente necesitamos, y después a preparar el prompt más preciso posible antes de entregárselo a la herramienta.\n\nAcompañanos mientras hacemos una primera versión. Cuando te mostremos la página, ayúdanos a revisarla y a decidir qué cambiar para mejorarla. Ayúdanos a aprovechar bien los recursos gratuitos y a evitar gastar generaciones o créditos innecesariamente.\n\nVe paso a paso, haznos las preguntas que realmente necesites y ayúdanos a aprender mientras construimos."}], "flashcard": "Acabamos de realizar este reto de IA:\n\n[ESCRIBAN EL NOMBRE DEL RETO]\n\nEsto fue lo que hicimos:\n[CUENTEN BREVEMENTE EL PROCESO]\n\nEstas fueron las herramientas que utilizamos:\n[HERRAMIENTAS]\n\nEstas fueron las instrucciones o prompts que más nos ayudaron:\n[PROMPTS]\n\nEsto fue lo que descubrimos:\n[APRENDIZAJES]\n\nEsto fue lo que cambiamos o mejoramos durante el proceso:\n[ITERACIONES]\n\nConvierte nuestra experiencia en una FLASHCARD VISUAL DE APRENDIZAJE.\n\nQuiero que la persona que vea la flashcard pueda entender rápidamente:\n\n1. Qué queríamos conseguir.\n2. Qué hicimos con IA.\n3. Qué herramienta utilizamos.\n4. Qué instrucción o prompt fue clave.\n5. Qué resultado obtuvimos.\n6. Qué aprendimos.\n7. Para qué podría servir esta capacidad en nuestro trabajo.\n\nHazla visual, clara y memorable. Usa poco texto, jerarquía visual y una secuencia que permita seguir fácilmente el recorrido desde el reto hasta el aprendizaje.", "images": {"hero": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/61xtSlACEQAAAAEAAFxjanVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAXD1qdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmIzODVkMjQ3LWY5NjAtNDIyNy05YTdmLTFjZTg5YTIyNjBiYwAAAAx4anVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAJ0Wp1bWIAAAA7anVtZEDLDDK7ikidpwsq1vR/Q2kTYzJwYS5pY29uAAAAABhjMnNofzD81gSthVQyGJag6QSRhAAAABdiZmRiAGltYWdlL3N2Zyt4bWwAAAAJd2JpZGI8c3ZnIHdpZHRoPSI3MTYiIGhlaWdodD0iNzE2IiB2aWV3Qm94PSIwIDAgNzE2IDcxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTUwOC43NDkgMzE3LjM5OUM1MTYuNzc3IDI4Ny4zMTQgNTA4Ljk5MSAyNTMuODg0IDQ4NS4zODkgMjMwLjI4MkM0NjEuNzg4IDIwNi42ODEgNDI4LjM2IDE5OC44OTUgMzk4LjI3MyAyMDYuOTIzQzM3Ni4yMzEgMTg0LjkyOCAzNDMuMzkgMTc0Ljk1NiAzMTEuMTQ4IDE4My41OTZDMjc4LjkwNiAxOTIuMjM0IDI1NS40NSAyMTcuMjkyIDI0Ny4zNiAyNDcuMzYxQzIxNy4yOTEgMjU1LjQ1MSAxOTIuMjMzIDI3OC45MSAxODMuNTk1IDMxMS4xNDlDMTc0Ljk1NyAzNDMuMzkxIDE4NC45Mj async function writeToClipboard(text){
  if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return; }
  const area = document.createElement("textarea");
  area.value = text; area.style.position = "fixed"; area.style.opacity = "0";
  document.body.appendChild(area); area.select(); document.execCommand("copy"); document.body.removeChild(area);
}
function copyHandler(btn, key){
  btn.addEventListener("click", async () => {
    try {
      await writeToClipboard(PROMPTS[key]);
      btn.classList.add("copied");
      btn.querySelector(".txt").textContent = "Copiado";
      setTimeout(() => { btn.classList.remove("copied"); btn.querySelector(".txt").textContent = "Copiar prompt"; }, 1800);
    } catch(e) {}
  });
}
const PROMPTS = {};

function promptPanel(label, text, key, note){
  PROMPTS[key] = text;
  return `

    <div class="promptbox"><pre>${esc(text)}</pre></div>

}
